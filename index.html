<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No, it wasn't bad luck, it was actually statistically probable, and here's why</title>
    <link rel="stylesheet" type="text/css" href="dygraph.min.css" />
    <link type="text/css" rel="stylesheet" href="style.css" />
</head>

<body>
    <button id="swapbtn">Swap modes</button>

    <div class="container">
        <div id="general" class="content-box">
            <h3>Dice expression (XdX, !, khX, dlX, dhX)</h3>
            <input type="text" id="diceInput" />
            <button id="calculateButton">Run</button>
            <br>
            <h3>Average</h3>
            <div id="avgs"></div>
            <h3>Median</h3>
            <div id="meds"></div>
            <h3>Graphs</h3>
            <div id="graphdiv"></div>
        </div>

        <div id="fortyk" class="content-box">
            <div class="fortyrow">
                <b>Dice count:</b>
                <input type="text" id="diceCount" value="10" />
            </div>
            <div class="fortyrow">
                <b>To hit:</b>
                <input type="text" id="toHit" value="4" />
            </div>
            <div class="fortyrow">
                <b>To crit:</b>
                <input type="text" id="hitCrit" value="6" />
            </div>
            <div class="fortyrow">
                <b>To wound:</b>
                <input type="text" id="toWound" value="4" />
            </div>
            <div class="fortyrow">
                <b>To crit:</b>
                <input type="text" id="woundCrit" value="6" />
            </div>
            <div class="fortyrow">
                <b>To save:</b>
                <input type="text" id="toSv" value="4" />
            </div>
            <div>
                <fieldset>
                    <legend>Options</legend>
                    <div>
                        <input type="text" id="sus" name="sus" style="max-width:25px;" />
                        <label for="sus">Sustained hits</label>
                    </div>
                    <div>
                        <input type="checkbox" id="let" name="let" />
                        <label for="let">Lethal hits</label>
                    </div>
                    <div>
                        <input type="checkbox" id="dev" name="dev" />
                        <label for="dev">Devastating wounds</label>
                    </div>
                </fieldset>
            </div>
            <br><br>
            <input type="button" value="Clear" id="clearbtn" />
            <input type="button" value="R O L L" id="mathhammer" />
            <br>
            <div id="fortygraphs"></div>
        </div>
    </div>
    <script type="text/javascript" src="dygraph.min.js"></script>
    <script type="text/javascript" src="math.js"></script>
    <script type="module" src="main.js"></script>
    <script type="module" src="40k.js"></script>
</body>

</html>
