<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No, it wasn't bad luck, it was actually statistically probable, and here's why</title>
    <link rel="stylesheet" type="text/css" href="dygraph.min.css" />
    <link type="text/css" rel="stylesheet" href="style.css" />
</head>

<body>
    <button id="swapbtn">Swap modes</button>

    <div class="container">
        <div id="general" class="content-box">
            <h3>Dice expression (XdX, !, khX, dlX, dhX)</h3>
            <input type="text" id="diceInput" />
            <button id="calculateButton">Run</button>
            <br>
            <h3>Average</h3>
            <div id="avgs"></div>
            <h3>Median</h3>
            <div id="meds"></div>
            <h3>Graphs</h3>
            <div id="graphdiv"></div>
        </div>

        <div id="fortyk" class="content-box">
            <div class="fortyrow">
                <b>Dice count:</b>
                <input type="text" id="diceCount" value="10" />
            </div>
            <div class="fortyrow">
                <b>To hit:</b>
                <input type="text" id="toHit" value="4" />
            </div>
            <div class="fortyrow">
                <b>To crit:</b>
                <input type="text" id="hitCrit" value="6" />
            </div>
            <div class="fortyrow">
                <b>To wound:</b>
                <input type="text" id="toWound" value="4" />
            </div>
            <div class="fortyrow">
                <b>To crit:</b>
                <input type="text" id="woundCrit" value="6" />
            </div>
            <div class="fortyrow">
                <b>To save:</b>
                <input type="text" id="toSv" value="4" />
            </div>
            <div>
                <fieldset>
                    <legend>Options</legend>
                    <div>
                        <input type="text" id="sus" name="sus" style="max-width:25px;" />
                        <label for="sus">Sustained hits</label>
                    </div>
                    <div>
                        <input type="checkbox" id="let" name="let" />
                        <label for="let">Lethal hits</label>
                    </div>
                    <div>
                        <input type="checkbox" id="dev" name="dev" />
                        <label for="dev">Devastating wounds</label>
                    </div>
                    <br>
                    <fieldset>
                        <legend>Rerolls (Hit, Wound, Save)</legend>
                        <div class="fortyrow">
                            <input type="radio" id="noHitReroll" name="hitreroll" checked/>
                            <label for="nohitreroll">None</label>

                            <input type="radio" id="noWoundReroll" name="woundreroll" checked/>
                            <label for="noWoundreroll">None</label>

                            <input type="radio" id="noSaveReroll" name="savereroll" checked/>
                            <label for="noSaveReroll">None</label>
                        </div>
                        <div class="fortyrow">
                            <input type="radio" id="onesHitReroll" name="hitreroll"/>
                            <label for="onesHitReroll">1's</label>

                            <input type="radio" id="onesWoundReroll" name="woundreroll"/>
                            <label for="onesWoundreroll">1's</label>

                            <input type="radio" id="onesSaveReroll" name="savereroll"/>
                            <label for="onesSaveReroll">1's</label>
                        </div>
                        <div class="fortyrow">
                            <input type="radio" id="allHitReroll" name="hitreroll"/>
                            <label for="allHitReroll">All</label>

                            <input type="radio" id="allWoundReroll" name="woundreroll"/>
                            <label for="allWoundreroll">All</label>

                            <input type="radio" id="allSaveReroll" name="savereroll"/>
                            <label for="allSaveReroll">All</label>
                        </div>
                    </fieldset>
                </fieldset>
            </div>
            <br><br>
            <input type="button" value="R O L L" id="mathhammer" />
            <br>
            <div>
                <h3>Results (% of dice rolled in the beginning)</h3>
                <div class="fortyrow">
                    <span>Hits:</span>
                    <span id="hitpercentage">0%</span>
                </div>
                <div class="fortyrow">
                    <span>Wounds:</span>
                    <span id="woundpercentage">0%</span>
                </div>
                <div class="fortyrow">
                    <span>Saves:</span>
                    <span id="savepercentage">0%</span>
                </div>
                <div class="fortyrow">
                    <span>Damage:</span>
                    <span id="damagepercentage">0%</span>
                </div>
            </div>
            <div id="fortygraphs"></div>
        </div>
    </div>
    <script type="text/javascript" src="dygraph.min.js"></script>
    <script type="text/javascript" src="math.js"></script>
    <script type="module" src="main.js"></script>
    <script type="module" src="40k.js"></script>
</body>

</html>
